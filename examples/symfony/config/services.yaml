services:
  App\Aif\SymfonyExecutionContextResolver: ~

  Batoi\Aif\Gateway\AifGateway:
    factory: ['App\Aif\AifFactory', 'gateway']
    arguments:
      $config: '%batoi_aif%'

  Batoi\Aif\Api\AifApi:
    arguments:
      $gateway: '@Batoi\Aif\Gateway\AifGateway'
      $contextResolver: '@App\Aif\SymfonyExecutionContextResolver'

  App\Controller\AifController:
    arguments:
      $aif: '@Batoi\Aif\Api\AifApi'
    tags: ['controller.service_arguments']

